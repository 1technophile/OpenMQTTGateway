name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13'
      enable-dev-ota:
        description: 'Enable development OTA builds'
        required: false
        type: boolean
        default: false
      version-tag:
        description: 'Version tag to inject into firmware (e.g., SHA or release tag)'
        required: false
        type: string
        default: 'unspecified'
      artifact-retention-days:
        description: 'Number of days to retain build artifacts'
        required: false
        type: number
        default: 7
      artifact-name-prefix:
        description: 'Prefix for artifact names (e.g., "firmware-" for dev builds)'
        required: false
        type: string
        default: ''
      prepare-for-deploy:
        description: 'Prepare firmware files for deployment with specific naming'
        required: false
        type: boolean
        default: false

jobs:
  load-environments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          ENVIRONMENTS=$(jq -c '.environments.all' .github/workflows/environments.json)
          echo "matrix=${ENVIRONMENTS}" >> $GITHUB_OUTPUT

  build:
    needs: load-environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environments: ${{ fromJson(needs.load-environments.outputs.matrix) }}
    name: Build ${{ matrix.environments }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.18.zip

      - name: Set version tag
        if: inputs.version-tag != 'version_tag'
        run: |
          if [ "${{ inputs.enable-dev-ota }}" = "true" ]; then
            # Development builds use latest_version_dev.json
            sed -i "s/version_tag/${{ inputs.version-tag }}/g" main/User_config.h scripts/latest_version_dev.json
          else
            # Production builds use latest_version.json
            sed -i "s/version_tag/${{ inputs.version-tag }}/g" main/User_config.h scripts/latest_version.json
          fi

      - name: Extract ESP32 platform version from platformio.ini
        run: |
          ESP32_VERSION=$(grep 'esp32_platform\s*=' platformio.ini | cut -d'@' -f2 | tr -d '[:space:]')
          echo "ESP32_PLATFORM_VERSION=${ESP32_VERSION}" >> $GITHUB_ENV

      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          PLATFORMIO_BUILD_FLAGS: ${{ inputs.enable-dev-ota && '"-DDEVELOPMENTOTA=true"' || '' }}
        run: |
          if [ "${{ inputs.enable-dev-ota }}" = "true" ]; then
            export PLATFORMIO_BUILD_FLAGS='"-DDEVELOPMENTOTA=true"'
          fi
          platformio run -e ${{ matrix.environments }}

      - name: Prepare firmware artifacts (standard)
        if: inputs.prepare-for-deploy == false
        run: |
          mkdir -p artifacts
          if [ -f .pio/build/${{ matrix.environments }}/firmware.bin ]; then
            cp .pio/build/${{ matrix.environments }}/firmware.bin artifacts/
          fi
          if [ -f .pio/build/${{ matrix.environments }}/partitions.bin ]; then
            cp .pio/build/${{ matrix.environments }}/partitions.bin artifacts/
          fi

      - name: Prepare firmware artifacts (deployment)
        if: inputs.prepare-for-deploy == true
        run: |
          mkdir -p artifacts
          if [ -f .pio/build/${{ matrix.environments }}/firmware.bin ]; then
            cp .pio/build/${{ matrix.environments }}/firmware.bin artifacts/${{ matrix.environments }}-firmware.bin
          fi
          if [ -f .pio/build/${{ matrix.environments }}/partitions.bin ]; then
            cp .pio/build/${{ matrix.environments }}/partitions.bin artifacts/${{ matrix.environments }}-partitions.bin
          fi
          if [ -f .pio/build/${{ matrix.environments }}/bootloader.bin ]; then
            cp .pio/build/${{ matrix.environments }}/bootloader.bin artifacts/${{ matrix.environments }}-bootloader.bin
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name-prefix }}${{ matrix.environments }}
          path: artifacts/
          retention-days: ${{ inputs.artifact-retention-days }}
