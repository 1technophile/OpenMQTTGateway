name: Release

on:
  release:
    types: [published]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.extract-tag.outputs.version }}
      release-id: ${{ steps.extract-release.outputs.id }}
      upload-url: ${{ steps.extract-release.outputs.upload_url }}
    steps:
      - name: Extract version tag
        id: extract-tag
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION_TAG}"

      - name: Extract release info
        id: extract-release
        run: |
          RELEASE_ID=$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)
          UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets{?name,label}"
          echo "id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "upload_url=${UPLOAD_URL}" >> $GITHUB_OUTPUT
          echo "Release ID: ${RELEASE_ID}"

  build:
    needs: prepare
    name: Build release firmware
    uses: ./.github/workflows/task-build.yml
    with:
      enable-dev-ota: false
      version-tag: ${{ needs.prepare.outputs.version-tag }}
      artifact-retention-days: 90

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    name: Deploy release assets
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: generated/artifacts
          merge-multiple: true

      # Each environment's artifact keeps its files under firmware_build/, so
      # after the merged download the binaries sit one level down and the
      # upload pattern below matched that directory (EISDIR). Move them up so
      # every firmware, bootloader, partitions and libraries file is attached.
      - name: Flatten firmware artifacts for upload
        run: |
          shopt -s nullglob
          files=(generated/artifacts/firmware_build/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware artifacts found in generated/artifacts/firmware_build"
            exit 1
          fi
          mv "${files[@]}" generated/artifacts/
          rmdir generated/artifacts/firmware_build
          echo "Firmware files to upload: ${#files[@]}"

      - name: Upload Release Assets
        uses: bgpat/release-asset-action@03b0c30db1c4031ce3474740b0e4275cd7e126a3
        with:
          pattern: "generated/artifacts/*"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-url: ${{ needs.prepare.outputs.upload-url }}
          allow-overwrite: true

  documentation:
    needs: [prepare, deploy]
    name: Build and deploy release documentation
    uses: ./.github/workflows/task-docs.yml
    with:
      mode: "prod"
      version: ${{ needs.prepare.outputs.version-tag }}
      url-prefix: "/"
      destination-dir: "."
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
